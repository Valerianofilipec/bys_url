
services:
  redis-node1:
    image: redis:6.2
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "/techblog/en/data/nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes"]
    ports:
      - "7001:6379"
    volumes:
      - redis-node1-data:/data

  redis-node2:
    image: redis:6.2
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "/techblog/en/data/nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes"]
    ports:
      - "7002:6379"
    volumes:
      - redis-node2-data:/data

  redis-node3:
    image: redis:6.2
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "/techblog/en/data/nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes"]
    ports:
      - "7003:6379"
    volumes:
      - redis-node3-data:/data

volumes:
  redis-node1-data:
  redis-node2-data:
  redis-node3-data:
